# Security headers for weavrn-landing static site
# Include this in the nginx server block: include /etc/nginx/snippets/security-headers.conf;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.goatcounter.com; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self' https://api.weavrn.com https://dev-api.weavrn.com https://mainnet.base.org https://sepolia.base.org https://*.alchemy.com wss:; font-src 'self' data:; frame-ancestors 'none'" always;
