name: CI & Deploy
on:
  push:
    branches: [develop, qa, main]
jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qa' && 'qa' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Weavrn/weavrn-sdk
          ref: ${{ github.ref_name }}
          path: weavrn-sdk
          token: ${{ secrets.SDK_TOKEN }}
      - run: mv weavrn-sdk ../weavrn-sdk && cd ../weavrn-sdk && npm install && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SOCIAL_MINING_ADDRESS: ${{ vars.SOCIAL_MINING_ADDRESS }}
          NEXT_PUBLIC_WVRN_TOKEN_ADDRESS: ${{ vars.WVRN_TOKEN_ADDRESS }}
          NEXT_PUBLIC_CHAIN_ID: ${{ vars.CHAIN_ID }}
          NEXT_PUBLIC_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
          NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS: ${{ vars.AGENT_REGISTRY_ADDRESS }}
          NEXT_PUBLIC_PAYMENT_ROUTER_ADDRESS: ${{ vars.PAYMENT_ROUTER_ADDRESS }}
          NEXT_PUBLIC_ESCROW_ROUTER_ADDRESS: ${{ vars.ESCROW_ROUTER_ADDRESS }}
          NEXT_PUBLIC_USAGE_INCENTIVES_ADDRESS: ${{ vars.USAGE_INCENTIVES_ADDRESS }}
          NEXT_PUBLIC_MERKLE_REWARDS_ADDRESS: ${{ vars.MERKLE_REWARDS_ADDRESS }}
          NEXT_PUBLIC_FEATURE_MINING: ${{ vars.FEATURE_MINING }}
          NEXT_PUBLIC_FEATURE_MARKETPLACE: ${{ vars.FEATURE_MARKETPLACE }}
          NEXT_PUBLIC_FEATURE_YOUTUBE: ${{ vars.FEATURE_YOUTUBE }}
          NEXT_PUBLIC_FEATURE_AGENTS: ${{ vars.FEATURE_AGENTS }}
          NEXT_PUBLIC_FEATURE_DASHBOARD: ${{ vars.FEATURE_DASHBOARD }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
          path: out/
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          path: repo
      - name: Deploy to droplet
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DROPLET_IP }}
          TARGET: /opt/${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'qa' && 'qa' || 'dev' }}/weavrn-landing/out/
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -rlgoDzvc --delete -e "ssh -i ~/.ssh/deploy_key" out/ "root@${HOST}:${TARGET}"
          scp -i ~/.ssh/deploy_key repo/deploy/nginx-security-headers.conf "root@${HOST}:/etc/nginx/snippets/security-headers.conf"
          ssh -i ~/.ssh/deploy_key "root@${HOST}" "nginx -t && systemctl reload nginx"
  notify:
    needs: [deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        run: |
          RESULT="${{ needs.deploy.result }}"
          ENV="${{ github.ref_name == 'main' && 'production' || github.ref_name == 'qa' && 'qa' || 'develop' }}"
          if [ "$RESULT" = "success" ]; then
            EMOJI=":white_check_mark:"
            STATUS="succeeded"
          else
            EMOJI=":x:"
            STATUS="failed"
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"${EMOJI} *weavrn-landing* deploy to *${ENV}* ${STATUS} — <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${GITHUB_SHA::7}> by ${{ github.actor }}\"}"
